<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title>1a English Test Review | School Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           DUOLINGO-INSPIRED THEME — bright, friendly, gamified
           ========================================================= */
        :root {
            --duo-green:        #58cc02;
            --duo-green-dark:   #58a700;
            --duo-blue:         #1cb0f6;
            --duo-blue-dark:    #1899d6;
            --duo-red:          #ff4b4b;
            --duo-red-dark:     #cf4040;
            --duo-orange:       #ff9600;
            --duo-orange-dark:  #e08600;
            --duo-yellow:       #ffc800;
            --duo-yellow-dark:  #e09e00;
            --duo-purple:       #ce82ff;
            --duo-purple-dark:  #a560e8;
            --duo-pink:         #ff86d9;
            --duo-pink-dark:    #e063b8;

            --bg-cream:         #fff8ef;
            --bg-card:          #ffffff;
            --border-card:      #e5e5e5;
            --border-card-hover:#d4d4d4;
            --text-dark:        #3c3c3c;
            --text-medium:      #777777;
            --text-light:       #afafaf;
        }

        * {
            font-family: 'Nunito', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        .display { font-family: 'Fredoka', 'Nunito', sans-serif; }

        html, body { overflow-x: hidden; }
        html { scroll-behavior: smooth; }

        body {
            background: #fdf2e9; /* warmer base */
            color: var(--text-dark) !important;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 5% 0%,    rgba(255, 134, 217, 0.32) 0%, transparent 35%),
                radial-gradient(circle at 95% 12%,  rgba(206, 130, 255, 0.30) 0%, transparent 38%),
                radial-gradient(circle at 0% 55%,   rgba(28, 176, 246, 0.26) 0%, transparent 38%),
                radial-gradient(circle at 100% 70%, rgba(88, 204, 2, 0.26) 0%, transparent 38%),
                radial-gradient(circle at 30% 100%, rgba(255, 150, 0, 0.26) 0%, transparent 38%),
                radial-gradient(circle at 75% 100%, rgba(255, 200, 0, 0.26) 0%, transparent 38%);
            background-attachment: fixed;
        }

        /* -- COLOR OVERRIDES (rewriting the dark-theme Tailwind classes) -- */
        .text-white          { color: var(--text-dark)   !important; }
        .text-gray-100, .text-gray-200, .text-gray-300 { color: var(--text-dark) !important; }
        .text-gray-400, .text-gray-500                 { color: var(--text-medium) !important; }
        .text-indigo-300, .text-indigo-400             { color: var(--duo-purple-dark) !important; }
        .text-purple-300, .text-purple-400             { color: var(--duo-purple-dark) !important; }
        .text-blue-200, .text-blue-300                 { color: var(--duo-blue-dark) !important; }
        .text-green-300, .text-green-400               { color: var(--duo-green-dark) !important; }
        .text-amber-200, .text-amber-300, .text-amber-400 { color: var(--duo-orange-dark) !important; }
        .text-red-300, .text-red-400                   { color: var(--duo-red-dark) !important; }

        /* -- CARD (replaces .glass / .glass-light from before) -- */
        .glass, .glass-light, .card-duo {
            background: #fffdf8 !important; /* warm off-white, less clinical */
            border: 2px solid #f0e7d4 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            color: var(--text-dark) !important;
            border-radius: 20px !important;
        }
        .glass.bg-blue-500\/10, .glass.bg-green-500\/10, .glass.bg-amber-500\/10,
        .glass.bg-indigo-500\/10, .glass.bg-purple-500\/10, .glass.bg-red-500\/10,
        .glass.bg-red-500\/20, .glass.bg-green-500\/20 {
            background: var(--bg-card) !important;
        }
        /* Restore the soft-tinted notice boxes */
        .glass.bg-blue-500\/10   { background: #e3f4ff !important; border-color: var(--duo-blue) !important; }
        .glass.bg-green-500\/10  { background: #ecfae0 !important; border-color: var(--duo-green) !important; }
        .glass.bg-amber-500\/10  { background: #fff3da !important; border-color: var(--duo-orange) !important; }
        .glass.bg-purple-500\/10 { background: #f6ecff !important; border-color: var(--duo-purple) !important; }
        .glass.bg-indigo-500\/10 { background: #ece4ff !important; border-color: var(--duo-purple-dark) !important; }
        .glass.bg-green-500\/20  { background: #d8f5b7 !important; border-color: var(--duo-green) !important; }
        .glass.bg-red-500\/20    { background: #ffe0e0 !important; border-color: var(--duo-red) !important; }

        /* -- THE SIGNATURE DUO BUTTON --
           Solid color with a slightly darker bottom border ("lip") that
           gets squashed when pressed (kid-pleasing tactile feel). */
        .btn-duo, .btn-primary, .btn-secondary, .btn-success {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--duo-blue) !important;
            color: #ffffff !important;
            border: none !important;
            border-bottom: 5px solid var(--duo-blue-dark) !important;
            border-radius: 16px !important;
            padding: 12px 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 14px;
            min-height: 50px;
            box-shadow: none !important;
            transition: filter 0.12s, transform 0.06s, border-bottom-width 0.06s, padding 0.06s;
            cursor: pointer;
            user-select: none;
            text-align: center;
        }
        .btn-duo:hover, .btn-primary:hover, .btn-secondary:hover, .btn-success:hover {
            filter: brightness(1.08);
            transform: none !important;
        }
        .btn-duo:active, .btn-primary:active, .btn-secondary:active, .btn-success:active {
            border-bottom-width: 0 !important;
            transform: translateY(5px) !important;
        }
        .btn-primary { background: var(--duo-blue) !important; border-bottom-color: var(--duo-blue-dark) !important; }
        .btn-success { background: var(--duo-green) !important; border-bottom-color: var(--duo-green-dark) !important; }
        .btn-secondary { background: var(--duo-orange) !important; border-bottom-color: var(--duo-orange-dark) !important; }
        .btn-purple { background: var(--duo-purple) !important; border-bottom-color: var(--duo-purple-dark) !important; color: white !important; }
        .btn-red { background: var(--duo-red) !important; border-bottom-color: var(--duo-red-dark) !important; }

        /* Ghost / outline button — used for "Back" etc. */
        button.border, button[class*="border-white"] {
            background: var(--bg-card) !important;
            color: var(--text-medium) !important;
            border: 2px solid var(--border-card) !important;
            border-bottom: 4px solid var(--border-card-hover) !important;
            border-radius: 16px !important;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
            min-height: 50px;
            transition: filter 0.12s, border-bottom-width 0.06s, transform 0.06s;
        }
        button.border:hover, button[class*="border-white"]:hover { background: #f7f7f7 !important; }
        button.border:active, button[class*="border-white"]:active { border-bottom-width: 0 !important; transform: translateY(4px); }

        /* -- INPUT FIELDS -- */
        input[type="text"], input[type="number"] {
            background: var(--bg-card) !important;
            color: var(--text-dark) !important;
            border: 2px solid var(--border-card) !important;
            border-radius: 14px !important;
            font-weight: 700;
            font-size: 18px !important;
            padding: 14px 18px !important;
            transition: border-color 0.15s, box-shadow 0.15s;
            min-height: 56px;
        }
        input[type="text"]::placeholder, input[type="number"]::placeholder {
            color: var(--text-light) !important;
            font-weight: 500;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none !important;
            border-color: var(--duo-blue) !important;
            box-shadow: 0 0 0 4px rgba(28, 176, 246, 0.15) !important;
        }

        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
            -webkit-appearance: none; margin: 0;
        }

        /* -- SCORE STEPPER (custom for score entry) -- */
        .score-card {
            background: #fffdf8;
            border: 2px solid #f0e7d4;
            border-bottom-width: 4px;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }
        .score-card:hover { border-color: var(--border-card-hover); }
        .score-card.has-value { border-color: var(--duo-green); background: #f7fdee; }
        /* Pastel tint per row */
        .score-card.tint-1 { background: #f0f8ff; }
        .score-card.tint-2 { background: #f3fbe7; }
        .score-card.tint-3 { background: #fff4f8; }
        .score-card.tint-4 { background: #f7f1ff; }
        .score-card.tint-5 { background: #fff7e6; }
        .score-card.tint-6 { background: #eafaff; }
        .score-card.tint-7 { background: #fff1e0; }
        .score-card.tint-8 { background: #f9f2ff; }
        .score-card.has-value.tint-1, .score-card.has-value.tint-2,
        .score-card.has-value.tint-3, .score-card.has-value.tint-4,
        .score-card.has-value.tint-5, .score-card.has-value.tint-6,
        .score-card.has-value.tint-7, .score-card.has-value.tint-8 {
            background: #f7fdee;
        }

        .score-emoji-box {
            width: 56px; height: 56px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
            background: #fdf3e1;
        }
        .score-emoji-box.color-1 { background: #e3f4ff; }
        .score-emoji-box.color-2 { background: #ecfae0; }
        .score-emoji-box.color-3 { background: #ffe5f1; }
        .score-emoji-box.color-4 { background: #f0e5ff; }
        .score-emoji-box.color-5 { background: #fff3da; }
        .score-emoji-box.color-6 { background: #e2f5fc; }
        .score-emoji-box.color-7 { background: #ffe9cf; }
        .score-emoji-box.color-8 { background: #f6e9ff; }

        .score-stepper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f4f4f4;
            border-radius: 50px;
            padding: 4px;
            flex-shrink: 0;
        }
        .stepper-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: white;
            border: none;
            font-size: 24px;
            font-weight: 800;
            color: var(--duo-blue);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 0 var(--border-card);
            transition: transform 0.06s, box-shadow 0.06s;
        }
        .stepper-btn:hover:not(:disabled) { background: #f0f9ff; }
        .stepper-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
        .stepper-btn:disabled { color: var(--text-light); cursor: not-allowed; opacity: 0.5; }
        .stepper-display {
            min-width: 60px;
            text-align: center;
            font-weight: 800;
            font-size: 22px;
            color: var(--text-dark);
            font-family: 'Fredoka', sans-serif;
        }
        /* Typeable score input: looks like the display number, but tap-and-type */
        input.stepper-input {
            width: 48px !important;
            min-width: 48px !important;
            min-height: 36px !important;
            text-align: center;
            background: transparent !important;
            border: 2px dashed transparent !important;
            border-radius: 8px !important;
            font-weight: 800 !important;
            font-size: 22px !important;
            color: var(--text-dark) !important;
            padding: 0 4px !important;
            font-family: 'Fredoka', sans-serif !important;
            transition: border-color 0.15s, background 0.15s;
        }
        input.stepper-input:hover {
            border-color: var(--duo-blue) !important;
            background: rgba(255,255,255,0.5) !important;
        }
        input.stepper-input:focus {
            border-color: var(--duo-blue) !important;
            border-style: solid !important;
            background: white !important;
            box-shadow: 0 0 0 3px rgba(28,176,246,0.15) !important;
        }

        /* -- PROGRESS BAR (skill meter) -- */
        .skill-meter {
            height: 16px !important;
            background: #f0f0f0 !important;
            border-radius: 50px !important;
            overflow: hidden;
            position: relative;
        }
        .skill-fill {
            height: 100%;
            border-radius: 50px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .skill-fill::after {
            content: '';
            position: absolute;
            top: 3px; left: 4px; right: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50px;
        }
        .progress-bar {
            background: var(--duo-green) !important;
            animation: none !important;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 3px; left: 4px; right: 4px;
            height: 4px;
            background: rgba(255,255,255,0.6);
            border-radius: 50px;
        }

        /* -- XP & STREAK BADGES -- */
        .xp-badge {
            background: var(--duo-yellow) !important;
            border-bottom: 4px solid var(--duo-yellow-dark) !important;
            border-radius: 50px !important;
            color: white !important;
            animation: none !important;
            font-weight: 900;
            font-size: 14px !important;
            padding: 6px 14px !important;
            display: inline-flex !important;
            align-items: center;
            gap: 4px;
        }
        .streak-fire {
            text-shadow: none !important;
            font-weight: 900;
            color: var(--duo-orange-dark) !important;
        }

        /* -- TOPIC CARD (used on dashboard) -- */
        .topic-card {
            background: var(--bg-card) !important;
            border: 2px solid var(--border-card) !important;
            border-bottom-width: 5px !important;
            border-radius: 22px !important;
            transition: transform 0.15s, border-color 0.15s;
        }
        .topic-card::before { display: none !important; }
        .topic-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-card-hover) !important;
        }
        .topic-card.border-amber-500\/50 { border-color: var(--duo-orange) !important; }

        /* -- ANSWER OPTION (MCQ) -- */
        .option-card {
            background: var(--bg-card) !important;
            border: 2px solid var(--border-card) !important;
            border-bottom-width: 4px !important;
            border-radius: 16px !important;
            color: var(--text-dark) !important;
            font-weight: 700;
            transition: filter 0.1s, border-color 0.1s, background 0.1s;
            min-height: 60px;
        }
        .option-card:hover {
            background: #f7f7f7 !important;
            border-color: var(--duo-blue) !important;
            transform: none !important;
        }
        .option-card.selected { background: #e3f4ff !important; border-color: var(--duo-blue) !important; }
        .option-card.correct { background: #ecfae0 !important; border-color: var(--duo-green) !important; }
        .option-card.incorrect { background: #ffe5e5 !important; border-color: var(--duo-red) !important; }
        .option-card .inline-flex {
            background: #f0f0f0 !important;
            color: var(--text-dark) !important;
        }

        /* -- CARD HOVER (generic) -- */
        .card-hover { transition: transform 0.15s !important; }
        .card-hover:hover { transform: translateY(-3px) !important; }

        /* -- ANIMATIONS -- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        @keyframes pop {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .float { animation: float 3s ease-in-out infinite; }
        .wiggle { animation: wiggle 0.6s ease-in-out; }
        .pop { animation: pop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .slide-in { animation: slideIn 0.4s ease-out both; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }

        .bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) both; }
        @keyframes bounceIn { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }

        /* -- DECORATIVE EMOJIS BG -- */
        .emoji-bg {
            position: fixed;
            font-size: 2.5rem;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            animation: float 4s ease-in-out infinite;
        }
        .emoji-bg:nth-child(2) { animation-delay: 0.5s; }
        .emoji-bg:nth-child(3) { animation-delay: 1s; }
        .emoji-bg:nth-child(4) { animation-delay: 1.5s; }
        .emoji-bg:nth-child(5) { animation-delay: 2s; }
        .emoji-bg:nth-child(6) { animation-delay: 2.5s; }

        /* -- DRAG AND DROP (sortable) -- */
        .sortable-list { display: flex; flex-direction: column; gap: 10px; }
        .sortable-item {
            background: var(--bg-card);
            color: var(--text-dark);
            padding: 14px 18px;
            border: 2px solid var(--border-card);
            border-bottom-width: 4px;
            border-radius: 16px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            touch-action: none;
            user-select: none;
            transition: border-color 0.15s;
        }
        .sortable-item:hover { border-color: var(--duo-blue); }
        .sortable-item:active { cursor: grabbing; }
        .sortable-item.correct-position { background: #ecfae0; border-color: var(--duo-green); }
        .sortable-item.wrong-position { background: #ffe5e5; border-color: var(--duo-red); }
        .sortable-ghost { opacity: 0.4; }
        .sortable-chosen { border-color: var(--duo-blue); transform: scale(1.02); }
        .sortable-drag { opacity: 0.95; }
        .drag-handle {
            font-size: 1.6rem;
            color: var(--duo-blue);
            flex-shrink: 0;
            font-weight: bold;
        }
        .order-arrow-btn {
            width: 32px;
            height: 24px;
            border: 2px solid var(--border-card);
            border-bottom-width: 3px;
            border-radius: 8px;
            background: white;
            color: var(--duo-blue);
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: filter 0.1s, transform 0.05s;
        }
        .order-arrow-btn:hover { background: #f0f9ff; }
        .order-arrow-btn:active { transform: translateY(1px); border-bottom-width: 2px; }
        .order-arrow-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* -- CONFETTI -- */
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: -20px;
            font-size: 1.8rem;
            animation: confetti-fall 3s linear forwards;
            pointer-events: none;
            z-index: 1000;
        }

        /* -- TYPOGRAPHY -- */
        h1, h2, h3 { font-family: 'Fredoka', 'Nunito', sans-serif; }
        h1 { font-weight: 700; letter-spacing: -0.5px; }
        .text-3xl, .text-4xl, .text-5xl { letter-spacing: -1px; line-height: 1.1; }

        /* Override the rainbow gradient text in the welcome header */
        .bg-gradient-to-r.from-indigo-400 {
            background: none !important;
            -webkit-background-clip: initial !important;
            background-clip: initial !important;
            -webkit-text-fill-color: var(--duo-green-dark) !important;
            color: var(--duo-green-dark) !important;
        }

        /* Reset any leftover dark gradients */
        .bg-gradient-to-r, .bg-gradient-to-br, .bg-gradient-to-tr {
            background: transparent !important;
        }

        input, button, select, textarea { font-size: 16px; }

        .prompt-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-dark);
        }

        /* Mobile tweaks */
        @media (max-width: 640px) {
            .emoji-bg { font-size: 1.8rem; opacity: 0.12; }
            h1 { line-height: 1.15; }
            .glass, .card-duo { border-radius: 16px !important; }
            .topic-card { border-radius: 18px !important; }
            body {
                background-image:
                    radial-gradient(circle at 0% 0%,   rgba(255, 134, 217, 0.18) 0%, transparent 40%),
                    radial-gradient(circle at 100% 100%, rgba(88, 204, 2, 0.18) 0%, transparent 40%);
            }
        }
        @media (max-width: 380px) {
            .score-card { padding: 12px !important; gap: 8px !important; }
            .score-emoji-box { width: 44px !important; height: 44px !important; font-size: 24px !important; }
            .stepper-btn { width: 36px; height: 36px; font-size: 20px; }
            input.stepper-input { width: 40px !important; min-width: 40px !important; font-size: 18px !important; }
            .score-stepper { padding: 3px; gap: 4px; }
            .btn-duo, .btn-primary, .btn-secondary, .btn-success { padding: 10px 14px; font-size: 13px; min-height: 46px; }
        }

        /* Better scrollbars */
        .pretty-scroll::-webkit-scrollbar { width: 8px; }

        { id: 'reading',      name: 'Reading',            emoji: '📖', max: 11, practicable: true },

       so students enter the exact numbers their teacher wrote on the paper).
       `sub` is a short hint that helps the student match the row to their corrected paper. */
    const SCORE_INPUTS = [
        { id: 'listening',         name: 'Listening',                 sub: '"At the breakfast table"',                  emoji: '🎧', max: 11 },
        { id: 'reading',           name: 'Reading',                   sub: '"Sporty Whiskers?"',                        emoji: '📖', max: 11 },
        { id: 'pronouns',          name: 'Object Pronouns',           sub: 'Fill in me/you/him/her/it/us/them',         emoji: '👥', max: 6 },
        { id: 'likes',             name: "Like / Don't Like",         sub: "Lisa & Paul dialogue (I like / I'd like)",  emoji: '❤️', max: 6 },
        { id: 'tenses_crazy',      name: '"A crazy day"',             sub: 'Fill-in text (16 blanks)',                  emoji: '⏰', max: 16, group: 'Present Tenses' },
        { id: 'tenses_box',        name: 'Verbs from the box',        sub: 'lie / listen / sit / play / try',           emoji: '⏰', max: 5,  group: 'Present Tenses' },
        { id: 'tenses_questions',  name: 'Questions & short answers', sub: '4 questions × 2 pts',                       emoji: '⏰', max: 8,  group: 'Present Tenses' },
        { id: 'ordinals',          name: 'Ordinal Numbers',           sub: '12 / 21 / 40 / 32 / 43 / 78 as words',      emoji: '🔢', max: 6 },
        { id: 'prepositions',      name: 'Prepositions of Time',      sub: 'in / on / at',                              emoji: '📅', max: 5 },

        { id: 'writing',           name: 'Writing',                   sub: '"At the restaurant" dialogue',              emoji: '✍️', max: 22 }
    ];

    const VOCAB_BONUS = { id: 'vocabulary', name: 'Vocabulary Bonus', emoji: '📚' };

    const MAX_TOTAL = TOPICS.reduce((s, t) => s + t.max, 0); // 100

    // Returns the combined score for a *topic* (1 of 9). Tenses sums its 3 sub-scores.
    function getTopicScore(topicId) {
        if (topicId === 'tenses') {
            return (state.scores.tenses_crazy || 0)
                 + (state.scores.tenses_box || 0)
                 + (state.scores.tenses_questions || 0);
        }
        return state.scores[topicId] || 0;

    /* ==========================================================================
       UTILITY FUNCTIONS
       ========================================================================== */
    function pct(score, max) {
        if (score === null || score === undefined || isNaN(score)) return 0;
        return Math.round((score / max) * 100);
    }
    function getPerformance(p) {
        if (p >= 90) return { level: 'Sehr gut',     color: '#58cc02', emoji: '🌟' };
        if (p >= 80) return { level: 'Gut',          color: '#84d827', emoji: '😊' };
        if (p >= 66) return { level: 'Befriedigend', color: '#1cb0f6', emoji: '👍' };
        if (p >= 50.1) return { level: 'Genügend',   color: '#ff9600', emoji: '📚' };
        return { level: 'Nicht genügend',           color: '#ff4b4b', emoji: '💪' };
    }
    function getOverallGrade(totalScore) {
        const p = pct(totalScore, MAX_TOTAL);
        return getPerformance(p);
    }
    function needsPractice(score, max) {
        return pct(score, max) < 80;
    }
    function totalScore() {
        return Object.keys(state.scores).reduce((s, k) => s + (state.scores[k] || 0), 0);
    }
    function addXP(amount) {
        state.xp += amount;
        state.streak++;
        checkAchievements();
    }
    function checkAchievements() {
        const got = state.achievements;
        if (state.xp >= 100 && !got.includes('century'))      got.push('century');
        if (state.streak >= 5 && !got.includes('streak5'))    got.push('streak5');
        if (state.completedTopics.length >= 3 && !got.includes('explorer')) got.push('explorer');
        if (state.completedTopics.length >= 5 && !got.includes('master'))   got.push('master');
    }
    const ACHIEVEMENT_DATA = {
        century:  { name: '100 XP Club',   emoji: '💯' },
        streak5:  { name: 'On Fire!',      emoji: '🔥' },
        explorer: { name: 'Topic Explorer', emoji: '🗺️' },
        master:   { name: 'English Master', emoji: '👑' }
    };
    // Normalize text for lenient comparison:
    //  - lowercase
    //  - strip punctuation (. , ! ? ; : ' " ’ ‘ - / hyphens)
    //  - collapse all whitespace
    //  - trim
    //  - expand common contractions to their long form
    function normalize(text) {
        if (text === null || text === undefined) return '';
        let s = String(text).toLowerCase();
        s = s.replace(/[’‘`´]/g, "'"); // unify smart quotes
        // Expand "X + n't" contractions (don't, isn't, can't, etc.) BEFORE stripping punctuation.
        // We can't use \bn't\b because "n" is preceded by a word char (no word boundary).
        s = s.replace(/\bcan't\b/g, 'cannot')
             .replace(/\bcannot\b/g, 'cannot')
             .replace(/\bwon't\b/g, 'will not')
             .replace(/\bshan't\b/g, 'shall not')
             .replace(/\bdon't\b/g, 'do not')
             .replace(/\bdoesn't\b/g, 'does not')
             .replace(/\bdidn't\b/g, 'did not')
             .replace(/\bisn't\b/g, 'is not')
             .replace(/\baren't\b/g, 'are not')
             .replace(/\bwasn't\b/g, 'was not')
             .replace(/\bweren't\b/g, 'were not')
             .replace(/\bhasn't\b/g, 'has not')
             .replace(/\bhaven't\b/g, 'have not')
             .replace(/\bhadn't\b/g, 'had not')
             .replace(/\bcouldn't\b/g, 'could not')
             .replace(/\bwouldn't\b/g, 'would not')
             .replace(/\bshouldn't\b/g, 'should not')
             .replace(/\bmightn't\b/g, 'might not')
             .replace(/\bmustn't\b/g, 'must not')
             // pronoun contractions
             .replace(/\bi'd\b/g, 'i would')
             .replace(/\bi'm\b/g, 'i am')
             .replace(/\bi've\b/g, 'i have')
             .replace(/\bi'll\b/g, 'i will')
             .replace(/\bit's\b/g, 'it is')
             .replace(/\bthey're\b/g, 'they are')
             .replace(/\bwe're\b/g, 'we are')
             .replace(/\byou're\b/g, 'you are')
             .replace(/\bhe's\b/g, 'he is')
             .replace(/\bshe's\b/g, 'she is')
             .replace(/\bthat's\b/g, 'that is')
             .replace(/\bwhat's\b/g, 'what is')
             .replace(/\blet's\b/g, 'let us');
        // Strip punctuation and hyphens, then collapse whitespace
        s = s.replace(/[.,!?;:"'/]+/g, '')
             .replace(/-/g, ' ')
             .replace(/\s+/g, ' ')
             .trim();
        return s;
    }

    // Lenient string match. Accepts:
    //  - `correct` as a string OR an array of accepted answers
    //  - case-insensitive, punctuation-insensitive, whitespace-insensitive
    //  - contracted and expanded forms (don't ↔ do not, I'd ↔ I would, ...)
    function looseEqual(user, correct) {
        const u = normalize(user);
        if (!u) return false;
        const accepted = Array.isArray(correct) ? correct : [correct];
        for (const c of accepted) {
            if (normalize(c) === u) return true;
        }
        return false;
    }

    // Damerau-Levenshtein-ish edit distance (insert, delete, substitute, transpose).
    function editDistance(a, b) {
        a = a || ''; b = b || '';
        const m = a.length, n = b.length;
        if (m === 0) return n;
        if (n === 0) return m;
        const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                if (a[i-1] === b[j-1]) {
                    dp[i][j] = dp[i-1][j-1];
                } else {
                    dp[i][j] = 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
                }
                // transposition
                if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) {
                    dp[i][j] = Math.min(dp[i][j], dp[i-2][j-2] + 1);
                }
            }
        }
        return dp[m][n];
    }

    // Returns the minimum edit distance from `user` to any accepted answer (after normalize()).
    function minEditDistanceToAccepted(user, accepted) {
        const u = normalize(user);
        if (!u) return Infinity;
        const list = Array.isArray(accepted) ? accepted : [accepted];
        let min = Infinity;
        for (const c of list) {
            const d = editDistance(u, normalize(c));
            if (d < min) min = d;
        }
        return min;
    }
    // Tolerance scales with word length: short words → 1, longer → 2.
    function isAlmost(user, accepted) {
        const u = normalize(user);
        if (!u) return false;
        const d = minEditDistanceToAccepted(u, accepted);
        // Compare against the longest accepted form to scale tolerance
        const list = Array.isArray(accepted) ? accepted : [accepted];
        const longest = Math.max(...list.map(c => normalize(c).length));
        const tol = longest >= 8 ? 2 : 1;
        return d > 0 && d <= tol;
    }

    /* ==========================================================================
       RENDER LOOP
       ========================================================================== */
    function render() {
        const app = document.getElementById('app');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        switch (state.screen) {
            case 'welcome':    app.innerHTML = renderWelcome();    break;
            case 'scores':     app.innerHTML = renderScores();     break;
            case 'dashboard':  app.innerHTML = renderDashboard();  break;
            case 'practice':   app.innerHTML = renderPractice();   break;
            case 'writing':    app.innerHTML = renderWriting();    break;
            case 'review':     app.innerHTML = renderReview();     break;
            case 'report':     app.innerHTML = renderReport();     break;
            case 'screenshot': app.innerHTML = renderScreenshot(); break;
        }
        attachListeners();
        // post-render hooks
        if (state.screen === 'writing' && state.writingStep === 'order') initSortable();
        if (state.screen === 'screenshot') launchConfetti();
        // Confetti when finishing a practice round with ≥80%
        if (state.screen === 'practice') {
            const topic = state.currentTopic;
            const total = PRACTICE_DATA[topic] ? PRACTICE_DATA[topic].length : 0;
            if (state.currentQuestion >= total && total > 0) {
                const correct = state.practiceAnswers.filter(a => a.correct).length;
                if (Math.round((correct / total) * 100) >= 80) launchConfetti(40);
            }
        }
    }

    function renderStartHereCard() {
        // Pick the weakest practicable topic to recommend
        const candidates = TOPICS
            .filter(t => t.practicable)
            .map(t => ({ ...t, score: getTopicScore(t.id), p: pct(getTopicScore(t.id), t.max) }))
            .filter(t => t.p < 80)
            .sort((a, b) => a.p - b.p);
        if (candidates.length === 0) {
            return `
                <div class="rounded-2xl p-4 md:p-5 mb-5 fade-in border-2" style="background: #ecfae0; border-color: var(--duo-green); border-bottom-width: 5px;">
                    <div class="flex items-center gap-3">
                        <span class="text-3xl md:text-4xl">🎉</span>
                        <div class="flex-1">
                            <p class="font-extrabold text-base md:text-lg" style="color: var(--duo-green-dark);">All sections look strong!</p>
                            <p class="text-xs md:text-sm font-semibold" style="color: var(--duo-green-dark); opacity: 0.85;">Practice anything below to polish further.</p>
                        </div>
                    </div>
                </div>`;
        }
        const weakest = candidates[0];
        const missed = weakest.max - weakest.score;
        return `

    function renderTopicCard(t, i) {
        const score = getTopicScore(t.id);

        return `

    /* ----------------------------- PRACTICE ----------------------------- */
    const PRACTICE_NAMES = {
        reading: '📖 Reading Practice',
        pronouns: '👥 Object Pronouns',
        likes: "❤️ Like / Don't Like",
        tenses: '⏰ Present Tenses',
        ordinals: '🔢 Ordinal Numbers',
        prepositions: '📅 Prepositions of Time',
        shopping: '💷 Shopping Phrases',
        vocabulary: '📚 Vocabulary Bonus'
    };

    function renderPractice() {
        const topic = state.currentTopic;
        const questions = PRACTICE_DATA[topic];
        const i = state.currentQuestion;
        const total = questions.length;

        if (i >= total) return renderPracticeComplete();

        const q = questions[i];
        const progress = (i / total) * 100;
        let body = '';

        // For reading practice, include a collapsible passage at the top so students
        // don't have to remember the Whiskers text from the test.
        let readingHeader = '';
        if (topic === 'reading') {
            readingHeader = `
                <details class="card-duo p-3 md:p-4 mb-4">
                    <summary class="cursor-pointer font-extrabold flex items-center gap-2 text-sm md:text-base" style="color: var(--duo-blue-dark);">
                        📖 Show the Whiskers text
                    </summary>
                    <div class="mt-3 text-sm md:text-base whitespace-pre-wrap leading-relaxed" style="color: var(--text-dark);">${escape(TEST_DATA.reading.passage)}</div>
                </details>`;
        }

        // Decide rendering: if the question has options[] → MCQ, else fill-in / ordinal
        if (q.options) {
            body = renderMCQ(q, topic);
        } else if (topic === 'ordinals') {
            body = renderOrdinal(q);
        } else {
            body = renderFillIn(q, topic);
        }

        return `
        <div class="min-h-screen p-3 md:p-8">
            <div class="max-w-2xl mx-auto">
                <div class="glass rounded-2xl p-3 md:p-4 mb-4 fade-in">
                    <div class="flex items-center justify-between mb-3">
                        <button id="exitPractice" class="text-gray-400 hover:text-white transition text-sm md:text-base">← Exit</button>
                        <h2 class="font-bold text-sm md:text-base">${PRACTICE_NAMES[topic]}</h2>
                        <div class="xp-badge px-2 md:px-3 py-1 rounded-full text-black text-xs md:text-sm font-bold">${state.xp} XP</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex-1 skill-meter"><div class="progress-bar h-full rounded-full" style="width:${progress}%"></div></div>
                        <span class="text-xs md:text-sm text-gray-400 mono">${i + 1}/${total}</span>
                    </div>
                </div>
                ${readingHeader}
                <div class="glass rounded-2xl md:rounded-3xl p-5 md:p-8 fade-in" style="animation-delay:0.1s">${body}</div>
            </div>
        </div>`;
    }

    function renderMCQ(q, topic) {
        const emoji = {
            reading: '📖', likes: '❤️', shopping: '💷',
            pronouns: '👥', prepositions: '📅'
        }[topic] || '🎯';
        // For short answer sets (3 items, like in/on/at), display the options as wider tap-pills horizontally
        const compact = q.options.every(o => o.length <= 4);
        const sentence = (q.sentence || q.q || '').replace('____', '<span class="inline-block min-w-[80px] border-b-2 border-indigo-400 mx-1"></span>');
        return `
            <div class="text-center mb-5">
                <span class="text-4xl md:text-5xl mb-3 block">${emoji}</span>
                <p class="text-gray-400 text-sm md:text-base">Choose the correct answer</p>
            </div>
            <div class="glass-light rounded-2xl p-4 md:p-6 mb-5 text-gray-800">
                <p class="text-base md:text-lg font-medium">${sentence}</p>
            </div>
            <div class="${compact ? 'grid grid-cols-3 gap-2 md:gap-3' : 'space-y-2 md:space-y-3'} mb-4">
                ${q.options.map((opt, idx) => `
                    <button class="answer-btn option-card glass rounded-xl ${compact ? 'p-3 text-center' : 'p-3 md:p-4 w-full text-left flex items-center gap-3'}" data-answer="${idx}">
                        ${compact ? '' : `<span class="inline-flex w-8 h-8 rounded-full bg-white/20 items-center justify-center font-bold shrink-0">${String.fromCharCode(65 + idx)}</span>`}
                        <span class="${compact ? 'text-lg md:text-xl font-extrabold' : 'text-sm md:text-base'}">${escape(opt)}</span>
                    </button>`).join('')}
            </div>
            <div id="feedback" class="hidden"></div>`;
    }

    function renderFillIn(q, topic) {
        const emoji = topic === 'pronouns' ? '👥' : topic === 'tenses' ? '⏰' : topic === 'prepositions' ? '📅' : '📚';
        const hint = q.hint ? `<span class="px-3 py-1 bg-green-500/20 text-green-300 rounded-full text-xs md:text-sm">💡 ${escape(q.hint)}</span>` : '';
        const sentence = (q.sentence || '').replace('____', '<span class="inline-block min-w-[80px] border-b-2 border-indigo-400 mx-1"></span>');
        return `
            <div class="text-center mb-5">
                <span class="text-4xl md:text-5xl mb-3 block">${emoji}</span>
                <p class="text-gray-400 mb-2 text-sm md:text-base">Fill in the missing word(s)</p>
                ${hint}
            </div>
            <div class="glass-light rounded-2xl p-4 md:p-6 mb-5 text-gray-800">
                <p class="text-base md:text-lg font-medium">${sentence}</p>
            </div>
            <div class="mb-2">
                <input id="textAnswer" type="text" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false"
                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-400 text-center text-lg">
                <p id="letterHintLine" class="text-center text-xs md:text-sm font-bold mt-2 mono" style="color: var(--duo-purple-dark); min-height: 18px;"></p>
            </div>
            <div class="flex gap-2 mb-2">
                <button id="letterHint" type="button" class="border" style="flex: 0 0 auto;" title="Reveal one letter">💡 Letter (-5 XP)</button>
                <button id="checkAnswer" class="btn-primary flex-1">Check ✓</button>
            </div>
            <div id="feedback" class="hidden mt-4"></div>`;
    }

    function renderOrdinal(q) {
        return `
            <div class="text-center mb-5">
                <span class="text-4xl md:text-5xl mb-3 block">🔢</span>
                <p class="text-gray-400 mb-2 text-sm md:text-base">Write the ordinal number as a word</p>
                <span class="px-3 py-1 bg-blue-500/20 text-blue-300 rounded-full text-xs md:text-sm">💡 ${escape(q.hint)}</span>
            </div>
            <div class="glass-light rounded-2xl p-6 mb-5 text-gray-800 text-center">

            </div>

                    class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-400 text-center text-lg">
                <p id="letterHintLine" class="text-center text-xs md:text-sm font-bold mt-2 mono" style="color: var(--duo-purple-dark); min-height: 18px;"></p>
            </div>
            <div class="flex gap-2 mb-2">
                <button id="letterHint" type="button" class="border" style="flex: 0 0 auto;">💡 Letter (-5 XP)</button>
                <button id="checkAnswer" class="btn-primary flex-1">Check ✓</button>
            </div>
            <div id="feedback" class="hidden mt-4"></div>`;
    }

    function renderPracticeComplete() {
        const topic = state.currentTopic;
        const total = PRACTICE_DATA[topic].length;
        const correct = state.practiceAnswers.filter(a => a.correct).length;
        const p = Math.round((correct / total) * 100);
        const xpEarned = correct * 10;

        if (!state.practiceHistory[topic]) state.practiceHistory[topic] = [];
        state.practiceHistory[topic].push({ correct, total, percentage: p });
        if (p >= 70 && !state.completedTopics.includes(topic)) state.completedTopics.push(topic);
        checkAchievements();

        return `
        <div class="min-h-screen p-4 flex items-center justify-center">
            <div class="glass rounded-3xl p-6 md:p-8 max-w-md w-full text-center fade-in">
                <div class="text-5xl md:text-6xl mb-3 bounce-in">${p >= 80 ? '🎉' : p >= 60 ? '👍' : '💪'}</div>
                <h2 class="text-2xl md:text-3xl font-bold mb-2">${p >= 80 ? 'Excellent!' : p >= 60 ? 'Good job!' : 'Keep going!'}</h2>
                <p class="text-gray-400 mb-5">${PRACTICE_NAMES[topic]}</p>
                <div class="glass rounded-2xl p-5 mb-5">
                    <div class="grid grid-cols-3 gap-3">
                        <div><div class="text-2xl md:text-3xl font-bold text-green-400">${correct}</div><div class="text-gray-400 text-xs md:text-sm">Correct</div></div>
                        <div><div class="text-2xl md:text-3xl font-bold text-indigo-400">${p}%</div><div class="text-gray-400 text-xs md:text-sm">Score</div></div>
                        <div><div class="text-2xl md:text-3xl font-bold text-amber-400">+${xpEarned}</div><div class="text-gray-400 text-xs md:text-sm">XP</div></div>
                    </div>
                </div>
                ${p >= 70 ? `<div class="glass rounded-xl p-3 mb-5 border border-green-500/30 bg-green-500/10"><p class="text-green-400 text-sm">✓ Topic marked as practiced!</p></div>` : ''}

                    <button id="practiceAgain" class="btn-primary py-3 rounded-xl font-semibold text-white">🔄 Practice Again</button>
                    <button id="backToDashboard" class="py-3 rounded-xl border border-white/20 hover:bg-white/5 transition">← Back to Dashboard</button>
                </div>
            </div>
        </div>`;
    }

    /* ==========================================================================
       HELPERS
       ========================================================================== */
    function escape(s) {
        if (s === null || s === undefined) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
    function updateScoreCard(topicId) {
        const t = SCORE_INPUTS.find(x => x.id === topicId);
        if (!t) return;
        const v = state.scores[topicId];
        const display = (v === null || v === undefined) ? 0 : v;
        const pctVal = pct(display, t.max);
        const card = document.querySelector(`.score-card[data-topic="${topicId}"]`);
        if (!card) return;
        if (display > 0) card.classList.add('has-value'); else card.classList.remove('has-value');
        const disp = document.getElementById('display_' + topicId);
        // Don't overwrite the input while the user is typing in it
        if (disp && document.activeElement !== disp) disp.value = display;
        const fill = card.querySelector('.skill-fill');
        if (fill) fill.style.width = pctVal + '%';
        const dec = card.querySelector('.score-dec');
        const inc = card.querySelector('.score-inc');
        if (dec) dec.disabled = display <= 0;
        if (inc) inc.disabled = display >= t.max;
        const label = card.querySelector('.mono');
        if (label) label.textContent = display + ' / ' + t.max;
    }

    function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        // Avoid the (rare) case where it shuffles back into the correct order
        if (a.length > 1 && a.every((item, i) => item.order === i + 1)) {
            [a[0], a[a.length - 1]] = [a[a.length - 1], a[0]];
        }
        return a;
    }

    let sortableInstance = null;
    function moveSortableItem(li, direction) {
        const list = li.parentElement;
        if (!list) return;
        if (direction === 'up') {
            const prev = li.previousElementSibling;
            if (prev) list.insertBefore(li, prev);
        } else {
            const next = li.nextElementSibling;
            if (next) list.insertBefore(next, li);
        }
        updateOrderArrowStates();
    }

    function updateOrderArrowStates() {
        const list = document.getElementById('sortable-list');
        if (!list) return;
        const items = [...list.querySelectorAll('.sortable-item')];
        items.forEach((li, idx) => {
            const up = li.querySelector('.order-up');
            const down = li.querySelector('.order-down');
            if (up) up.disabled = idx === 0;
            if (down) down.disabled = idx === items.length - 1;
        });
    }

    function initSortable() {
        const list = document.getElementById('sortable-list');
        if (!list) return;
        if (sortableInstance) { try { sortableInstance.destroy(); } catch(e){} sortableInstance = null; }
        sortableInstance = Sortable.create(list, {
            animation: 180,
            delay: 120,
            delayOnTouchOnly: true,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            dragClass: 'sortable-drag',
            forceFallback: false,
            handle: '.drag-handle',
            onSort: updateOrderArrowStates
        });
        // Wire up the arrow buttons
        list.querySelectorAll('.order-up').forEach(btn => {
            btn.addEventListener('click', e => moveSortableItem(e.currentTarget.closest('.sortable-item'), 'up'));
        });
        list.querySelectorAll('.order-down').forEach(btn => {
            btn.addEventListener('click', e => moveSortableItem(e.currentTarget.closest('.sortable-item'), 'down'));
        });
        updateOrderArrowStates();
    }
    function launchConfetti(count) {
        const emojis = ['🎉','⭐','✨','🌟','🎊','💫'];
        const container = document.body;
        const n = count || 30;
        for (let i = 0; i < n; i++) {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = (Math.random() * 100) + 'vw';
            el.style.animationDelay = (Math.random() * (n > 20 ? 1.5 : 0.5)) + 's';
            el.style.animationDuration = (2 + Math.random() * 2) + 's';
            container.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }
    }

    /* ==========================================================================
       EVENT LISTENERS
       ========================================================================== */
    function attachListeners() {
        // ---------- WELCOME ----------
        const startBtn = document.getElementById('startBtn');
        if (startBtn) {
            startBtn.addEventListener('click', startApp);
            document.getElementById('studentName')?.addEventListener('keypress', e => {
                if (e.key === 'Enter') startApp();
            });
        }
        function startApp() {
            const inp = document.getElementById('studentName');
            const val = (inp.value || '').trim();
            if (!val) {
                inp.placeholder = 'Please enter your name!';
                inp.style.borderColor = 'var(--duo-red)';
                inp.style.boxShadow = '0 0 0 4px rgba(255, 75, 75, 0.15)';
                inp.focus();
                // Subtle shake to draw attention
                inp.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-6px)' },
                    { transform: 'translateX(6px)' },
                    { transform: 'translateX(-4px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 350, easing: 'ease-out' });
                return;
            }
            state.studentName = val;
            state.screen = 'scores';
            render();
        }

        // ---------- SCORES (stepper, whole numbers only) ----------
        const stepBy = (topicId, delta) => {
            const t = SCORE_INPUTS.find(x => x.id === topicId);
            const cur = state.scores[topicId] === null || state.scores[topicId] === undefined ? 0 : state.scores[topicId];
            let next = Math.round(cur + delta);
            if (next < 0) next = 0;
            if (next > t.max) next = t.max;
            state.scores[topicId] = next;
            updateScoreCard(topicId);
        };
        document.querySelectorAll('.score-inc').forEach(btn => {
            btn.addEventListener('click', e => stepBy(e.currentTarget.dataset.topic, +1));
        });
        document.querySelectorAll('.score-dec').forEach(btn => {
            btn.addEventListener('click', e => stepBy(e.currentTarget.dataset.topic, -1));
        });
        // Direct-typing on the score input
        document.querySelectorAll('.stepper-input').forEach(input => {
            input.addEventListener('focus', e => e.target.select());
            input.addEventListener('input', e => {
                const id = e.target.dataset.topic;
                const t = SCORE_INPUTS.find(x => x.id === id);
                if (!t) return;
                let raw = e.target.value.replace(/[^0-9]/g, '');
                let v = raw === '' ? 0 : parseInt(raw, 10);
                if (isNaN(v) || v < 0) v = 0;
                if (v > t.max) v = t.max;
                // Reflect clipping back to the input
                if (raw && parseInt(raw, 10) !== v) e.target.value = String(v);
                else if (raw !== e.target.value) e.target.value = raw;
                state.scores[id] = v;
                // Update visuals (do NOT touch the input itself so focus is preserved)
                const card = e.target.closest('.score-card');
                if (card) {
                    if (v > 0) card.classList.add('has-value'); else card.classList.remove('has-value');
                    const fill = card.querySelector('.skill-fill');
                    if (fill) fill.style.width = pct(v, t.max) + '%';
                    const label = card.querySelector('.mono');
                    if (label) label.textContent = v + ' / ' + t.max;
                    const dec = card.querySelector('.score-dec');
                    const inc = card.querySelector('.score-inc');
                    if (dec) dec.disabled = v <= 0;
                    if (inc) inc.disabled = v >= t.max;
                }
            });
            input.addEventListener('blur', e => {
                // Empty input → 0
                if (e.target.value === '') e.target.value = '0';
            });
        });
        document.getElementById('analyzeBtn')?.addEventListener('click', () => {
            state.screen = 'dashboard';
            render();
        });
        document.getElementById('backToWelcome')?.addEventListener('click', () => { state.screen = 'welcome'; render(); });
        document.getElementById('editScores')?.addEventListener('click', () => { state.screen = 'scores'; render(); });

        // ---------- DASHBOARD: practice/review buttons ----------
        document.querySelectorAll('.practice-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                const topic = e.currentTarget.dataset.topic;
                if (topic === 'writing') {
                    state.currentTopic = 'writing';
                    state.screen = 'writing';
                    state.writingStep = 'menu';
                } else {
                    state.currentTopic = topic;
                    state.currentQuestion = 0;
                    state.practiceAnswers = [];
                    state.almostUsed = false;
                    state.letterHintShown = {};
                    state.screen = 'practice';
                }
                render();
            });
        });
        document.querySelectorAll('.review-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                state.currentTopic = e.currentTarget.dataset.topic;
                state.screen = 'review';
                render();
            });
        });

        // ---------- REVIEW ----------
        const closeReview = () => { state.screen = 'dashboard'; render(); };
        document.getElementById('closeReview')?.addEventListener('click', closeReview);
        document.getElementById('closeReviewBtn')?.addEventListener('click', closeReview);

        // ---------- PRACTICE ----------
        document.getElementById('exitPractice')?.addEventListener('click', () => { state.screen = 'dashboard'; render(); });
        document.querySelectorAll('.answer-btn').forEach(btn => {
            btn.addEventListener('click', e => handleMCQAnswer(e.currentTarget));
        });
        document.getElementById('checkAnswer')?.addEventListener('click', handleTextAnswer);
        document.getElementById('textAnswer')?.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                const btn = document.getElementById('checkAnswer') || document.getElementById('checkVocab');
                btn?.click();
            }
        });
        document.getElementById('letterHint')?.addEventListener('click', handleLetterHint);
        document.getElementById('practiceAgain')?.addEventListener('click', () => {
            state.currentQuestion = 0;
            state.practiceAnswers = [];
            state.almostUsed = false;
            state.letterHintShown = {};
            render();
        });
        document.getElementById('backToDashboard')?.addEventListener('click', () => { state.screen = 'dashboard'; render(); });

        // ---------- WRITING LAB ----------
        document.getElementById('exitWriting')?.addEventListener('click', () => { state.screen = 'dashboard'; render(); });
        document.querySelectorAll('.writing-card').forEach(btn => {
            btn.addEventListener('click', e => {
                state.writingStep = e.currentTarget.dataset.step;
                if (state.writingStep === 'order') state.writingOrderIdx = 0;
                if (state.writingStep === 'vocab') state.writingVocabIdx = 0;
                render();
            });
        });
        document.querySelectorAll('.writing-back').forEach(btn => {
            btn.addEventListener('click', e => {
                state.writingStep = e.currentTarget.dataset.step;
                render();
            });
        });
        document.getElementById('checkOrder')?.addEventListener('click', handleCheckOrder);
        document.getElementById('resetOrder')?.addEventListener('click', () => { render(); });
        document.getElementById('checkVocab')?.addEventListener('click', handleWritingVocab);

        // ---------- REPORT / SCREENSHOT / PROMPT ----------
        document.getElementById('generateReport')?.addEventListener('click', () => { state.screen = 'report'; render(); });
        document.getElementById('backFromReport')?.addEventListener('click', () => { state.screen = 'dashboard'; render(); });
        document.getElementById('downloadPDF')?.addEventListener('click', generatePDF);
        document.getElementById('goToScreenshot')?.addEventListener('click', () => { state.screen = 'screenshot'; render(); });
        document.getElementById('backFromScreenshot')?.addEventListener('click', () => { state.screen = 'report'; render(); });
        document.getElementById('readyToSubmit')?.addEventListener('click', () => {
            launchConfetti();
            setTimeout(() => alert("Awesome! 🎉 You're all done. Have a great day, " + state.studentName + "!"), 200);
        });
    }

    /* ==========================================================================
       PRACTICE ANSWER HANDLERS
       ========================================================================== */
    function handleMCQAnswer(btn) {
        if (btn.classList.contains('disabled')) return;
        const topic = state.currentTopic;
        const q = PRACTICE_DATA[topic][state.currentQuestion];
        const userAnswer = parseInt(btn.dataset.answer, 10);
        const isCorrect = userAnswer === q.answer;

        document.querySelectorAll('.answer-btn').forEach(b => b.classList.add('disabled'));
        btn.classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
            const correctBtn = document.querySelector(`[data-answer="${q.answer}"]`);
            correctBtn?.classList.add('correct');
        }

        if (isCorrect) addXP(10); else state.streak = 0;
        state.practiceAnswers.push({ correct: isCorrect });
        recordPracticeResult(state.currentTopic, state.currentQuestion, isCorrect);
        showFeedback(isCorrect, q.options ? q.options[q.answer] : '', q.explanation);
    }
    function handleTextAnswer() {
        const topic = state.currentTopic;
        const q = PRACTICE_DATA[topic][state.currentQuestion];
        const input = document.getElementById('textAnswer');
        const user = (input.value || '').trim();
        const acceptedList = q.accepted && q.accepted.length ? q.accepted : [q.answer];
        const isCorrect = looseEqual(user, acceptedList);

        // "Almost!" path — only on the first attempt and if the user is 1-2 chars away
        const alreadyTriedOnce = !!state.almostUsed;
        if (!isCorrect && !alreadyTriedOnce && isAlmost(user, acceptedList)) {
            showAlmost(user);
            return;
        }
        state.almostUsed = false;

        if (isCorrect) addXP(10); else state.streak = 0;
        state.practiceAnswers.push({ correct: isCorrect });
        recordPracticeResult(state.currentTopic, state.currentQuestion, isCorrect);
        const primary = q.answer;
        const alternatives = (q.accepted && q.accepted.length > 1) ? q.accepted.filter(a => a !== primary) : [];
        const altText = alternatives.length ? ` (also accepted: ${alternatives.join(', ')})` : '';
        showFeedback(isCorrect, primary + altText, q.explanation || q.hint || '');
    }

    function handleLetterHint() {
        const topic = state.currentTopic;
        const q = PRACTICE_DATA[topic][state.currentQuestion];
        if (!q) return;
        const answer = q.answer || (q.accepted && q.accepted[0]) || '';
        if (!answer) return;
        state.letterHintShown = state.letterHintShown || {};
        const key = topic + ':' + state.currentQuestion;
        const cur = state.letterHintShown[key] || { revealed: [], masked: null };
        if (!cur.masked) {
            cur.masked = Array.from(answer).map(ch => /[a-z]/i.test(ch) ? '_' : ch);
            cur.revealed = [];
        }
        const lettersIdxs = [];
        for (let i = 0; i < answer.length; i++) {
            if (/[a-z]/i.test(answer[i]) && cur.revealed.indexOf(i) < 0) lettersIdxs.push(i);
        }
        const maxReveal = Math.ceil(answer.replace(/[^a-z]/gi, '').length / 2);
        if (lettersIdxs.length === 0 || cur.revealed.length >= maxReveal) {
            const line = document.getElementById('letterHintLine');
            if (line) line.textContent = "That's all the help on this one — give it a go!";
            return;
        }
        const pick = lettersIdxs[Math.floor(Math.random() * lettersIdxs.length)];
        cur.revealed.push(pick);
        cur.masked[pick] = answer[pick];
        state.letterHintShown[key] = cur;
        state.xp = Math.max(0, state.xp - 5);
        const line = document.getElementById('letterHintLine');
        if (line) line.textContent = cur.masked.join(' ').toUpperCase();
    }

    function recordPracticeResult(topic, qIdx, correct) {
        if (!state.practiceResults[topic]) state.practiceResults[topic] = {};
        state.practiceResults[topic][qIdx] = correct ? 'correct' : 'wrong';
    }

    function showFeedback(isCorrect, correctAnswer, explanation) {
        const f = document.getElementById('feedback');
        if (!f) return;
        f.classList.remove('hidden');
        const topic = state.currentTopic;
        const isLast = state.currentQuestion >= PRACTICE_DATA[topic].length - 1;
        const bannerStyle = isCorrect
            ? 'background: #d8f5b7; border-color: var(--duo-green); color: var(--duo-green-dark);'
            : 'background: #ffe0e0; border-color: var(--duo-red); color: var(--duo-red-dark);';
        const icon = isCorrect ? '🎉' : '💭';
        const headline = isCorrect ? 'Nice one!' : 'Not quite';
        f.innerHTML = `
            <div class="rounded-2xl p-4 md:p-5 border-2 ${isCorrect ? 'bounce-in' : 'fade-in'}" style="${bannerStyle} border-bottom-width: 5px;">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl md:text-4xl ${isCorrect ? 'wiggle' : ''}">${icon}</span>
                    <div class="flex-1">
                        <p class="font-extrabold text-lg md:text-xl">${headline}${isCorrect ? ' &nbsp; +10 XP' : ''}</p>
                        ${correctAnswer ? `<p class="text-sm md:text-base font-semibold opacity-90 mt-0.5">Answer: <strong>${escape(correctAnswer)}</strong></p>` : ''}
                    </div>
                </div>
                ${explanation ? `<p class="text-xs md:text-sm font-semibold opacity-80 mt-1">💡 ${escape(explanation)}</p>` : ''}
            </div>
            <button id="nextQuestion" class="${isCorrect ? 'btn-success' : 'btn-primary'} w-full mt-4">
                ${isLast ? 'See Results 🎉' : 'Continue →'}
            </button>`;
        if (isCorrect) launchConfetti(14);
        document.getElementById('nextQuestion').addEventListener('click', () => {
            state.currentQuestion++;
            state.almostUsed = false;
            render();
        });
    }

    function showAlmost(userText) {
        state.almostUsed = true;
        const f = document.getElementById('feedback');
        if (!f) return;
        f.classList.remove('hidden');
        f.innerHTML = `
            <div class="rounded-2xl p-4 md:p-5 border-2 fade-in" style="background: #fff3da; border-color: var(--duo-orange); border-bottom-width: 5px; color: var(--duo-orange-dark);">
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-3xl md:text-4xl">🤏</span>
                    <div class="flex-1">
                        <p class="font-extrabold text-lg md:text-xl">Almost there!</p>
                        <p class="text-xs md:text-sm font-semibold opacity-80">You wrote <strong>"${escape(userText)}"</strong> — check the spelling and try once more.</p>
                    </div>
                </div>
            </div>
            <button id="tryAgain" class="btn-secondary w-full mt-4">Try again 🔁</button>`;
        document.getElementById('tryAgain').addEventListener('click', () => {
            f.classList.add('hidden');
            const inp = document.getElementById('textAnswer');
            if (inp) { inp.focus(); inp.select(); }
        });
    }

function handleCheckOrder() {
        const list = document.getElementById('sortable-list');
        if (!list) return;
        const items = [...list.querySelectorAll('.sortable-item')];
        let allCorrect = true;
        items.forEach((el, idx) => {
            const order = parseInt(el.dataset.order, 10);
            el.classList.remove('correct-position', 'wrong-position');
            if (order === idx + 1) el.classList.add('correct-position');
            else { el.classList.add('wrong-position'); allCorrect = false; }
        });
        const fb = document.getElementById('orderFeedback');
        fb.classList.remove('hidden');
        if (allCorrect) {
            addXP(20);
            if (!state.completedTopics.includes('writing')) state.completedTopics.push('writing');
            checkAchievements();
            fb.innerHTML = `
                <div class="glass rounded-xl p-4 bg-green-500/20 border border-green-500/30">
                    <p class="text-green-400 font-bold">🎉 Perfect order! +20 XP</p>
                    <p class="text-gray-300 text-xs md:text-sm mt-1">You understand how a restaurant dialogue flows.</p>
                </div>
                <button id="nextOrderRound" class="btn-primary w-full mt-3 py-3 rounded-xl font-semibold text-white">
                    ${state.writingOrderIdx < PRACTICE_DATA.writing_order.length - 1 ? 'Next Dialogue →' : 'Finish 🏆'}
                </button>`;
            document.getElementById('nextOrderRound').addEventListener('click', () => {
                state.writingOrderIdx++;
                render();
            });
        } else {
            fb.innerHTML = `
                <div class="glass rounded-xl p-4 bg-red-500/20 border border-red-500/30">
                    <p class="text-red-400 font-bold">Not quite right yet.</p>
                    <p class="text-gray-300 text-xs md:text-sm mt-1">Green lines are in the right place. Move the red lines and try again.</p>
                </div>`;
        }
    }
        function handleWritingVocab() {
        const i = state.writingVocabIdx;
        const q = PRACTICE_DATA.writing_vocab[i];
        const input = document.getElementById('textAnswer');
        const user = (input.value || '').trim();
        const acceptedList = q.accepted && q.accepted.length ? q.accepted : [q.answer];
        const isCorrect = looseEqual(user, acceptedList);
        if (isCorrect) addXP(10); else state.streak = 0;
        const f = document.getElementById('feedback');
        f.classList.remove('hidden');
        const isLast = i >= PRACTICE_DATA.writing_vocab.length - 1;
        const alternatives = (q.accepted && q.accepted.length > 1) ? q.accepted.filter(a => a !== q.answer) : [];
        const altText = alternatives.length ? ` <span class="text-xs" style="color: var(--text-medium);">(also: ${escape(alternatives.join(', '))})</span>` : '';
        f.innerHTML = `
            <div class="glass rounded-xl p-4 ${isCorrect ? 'bg-green-500/20 border border-green-500/30' : 'bg-red-500/20 border border-red-500/30'}">
                <p class="${isCorrect ? 'text-green-400' : 'text-red-400'} font-bold mb-1">
                    ${isCorrect ? '✓ Correct! +10 XP' : '✗ Not quite'}
                </p>
                <p class="text-gray-200 text-sm md:text-base">Correct answer: <strong>${escape(q.answer)}</strong>${altText}</p>
                <p class="text-gray-400 text-xs md:text-sm mt-1">💡 ${escape(q.hint)}</p>
            </div>
            <button id="nextVocab" class="btn-primary w-full mt-4 py-3 rounded-xl font-semibold text-white">
                ${isLast ? 'Finish 🎉' : 'Next →'}
            </button>`;
        document.getElementById('nextVocab').addEventListener('click', () => {
            state.writingVocabIdx++;
            render();
        });
    }

    /* ==========================================================================
       PDF GENERATION
       ========================================================================== */
    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const total = totalScore();
        const totalP = pct(total, MAX_TOTAL);
        const overall = getOverallGrade(total);
        // Map performance to a label without umlauts for PDF safety
        const safeLevel = overall.level.replace('ü', 'ue').replace('ä','ae').replace('ö','oe');

        // Header
        doc.setFillColor(99, 102, 241);
        doc.rect(0, 0, 210, 38, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.text('Test Review Report', 105, 18, { align: 'center' });
        doc.setFontSize(11);
        doc.text('3rd English Test - Class 1a - May 21st 2026', 105, 28, { align: 'center' });

        // Student info
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(13);
        doc.text(`Student: ${state.studentName}`, 20, 52);
        doc.text(`Grade: ${safeLevel}`, 130, 52);

        // Total score box
        doc.setFillColor(240, 240, 255);
        doc.roundedRect(20, 60, 170, 22, 3, 3, 'F');
        doc.setFontSize(18);
        doc.setTextColor(99, 102, 241);
        doc.text(`${total} / ${MAX_TOTAL} Points  (${totalP}%)`, 105, 75, { align: 'center' });

        // Score breakdown
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(13);
        doc.text('Score Breakdown:', 20, 96);

        let y = 105;
        doc.setFontSize(10);
        TOPICS.forEach(t => {
            const s = getTopicScore(t.id);
            const p = pct(s, t.max);
            doc.text(t.name, 25, y);
            doc.text(`${s} / ${t.max}  (${p}%)`, 105, y);
            // bar
            doc.setFillColor(230, 230, 230);
            doc.rect(140, y - 4, 45, 4, 'F');
            const c = p >= 80 ? [16,185,129] : p >= 66 ? [99,102,241] : p >= 50.1 ? [245,158,11] : [239,68,68];
            doc.setFillColor(c[0], c[1], c[2]);
            doc.rect(140, y - 4, (p / 100) * 45, 4, 'F');
            y += 9;
        });

        // Practice summary
        y += 6;
        doc.setFontSize(13);
        doc.text('Practice Summary:', 20, y);
        y += 8;
        doc.setFontSize(10);
        doc.text(`XP Earned: ${state.xp}`, 25, y); y += 6;
        doc.text(`Topics Practiced: ${state.completedTopics.length}`, 25, y); y += 6;
        doc.text(`Achievements: ${state.achievements.length}`, 25, y);

        // Footer
        doc.setFontSize(9);
        doc.setTextColor(128, 128, 128);
        doc.text(`Generated on ${new Date().toLocaleDateString('de-AT')}`, 105, 285, { align: 'center' });

        doc.save(`${state.studentName.replace(/\s+/g, '_')}_Test_Report.pdf`);
    }

    /* ==========================================================================
       INIT
       ========================================================================== */
    document.addEventListener('DOMContentLoaded', render);
    if (document.readyState !== 'loading') render();
    </script>
